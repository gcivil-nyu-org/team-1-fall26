# Longer run of the property-based fuzz tests (syncmily/tests/security/test_hardening_fuzz.py).
# CI runs the same tests with 20 examples per push; this nightly run uses 200.
# Actions are pinned to commit SHAs, as in ci.yml.
name: Fuzz nightly

on:
  schedule:
    - cron: "0 7 * * *"  # daily, 02:00 New York (03:00 in summer)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz tests (200 examples)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18  # production runs RDS PostgreSQL 18
        env:
          POSTGRES_DB: syncmily
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        volumes:
          - /var/run/postgresql:/var/run/postgresql
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: syncmily
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: "5432"
      DJANGO_HTTPS: "false"
      FUZZ_EXAMPLES: "200"
      CI_SLOW: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      # Throwaway keys made fresh each run (never the production ones), masked in the log.
      - name: Generate throwaway keys
        run: |
          secret="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          fernet="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          echo "::add-mask::$secret"
          echo "::add-mask::$fernet"
          echo "DJANGO_SECRET_KEY=$secret" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEYS=$fernet" >> "$GITHUB_ENV"
      - run: python manage.py test syncmily.tests.security.test_hardening_fuzz
