# Drop scanner traffic before it reaches Django. Syncmily has no PHP, WordPress
# or dotfiles to serve, so these requests only come from bots looking for holes.
# 444 closes the connection without a response. /.well-known stays open for
# HTTPS certificate checks.
location ~* \.(php\d?|phtml|asp|aspx|jsp|cgi)$ { return 444; }
location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc|phpmyadmin|pma|cgi-bin|vendor/phpunit)(/|$) { return 444; }
location ~ /\.(?!well-known/) { return 444; }
